<script>
(() => {
  'use strict';

  const params = new URLSearchParams(location.search);
  const SEED = parseInt(params.get('seed'), 10) || 5;
  const TIME_SCALE = 0.6;
  const LOOP = params.get('loop') === '1';
  const START_AT = parseFloat(params.get('t')) || 0;
  const Q_FORCE = parseFloat(params.get('q')) || 0;

  const KEYS = [
    [0.0, 0.00, 0.00, 0.00, 0.0, 0.00, 0.00],
    [8.0, 0.00, 0.00, 0.00, 0.0, 0.00, 0.00],
    [13.0, 0.42, 0.22, 0.00, 0.0, 0.25, 0.00],
    [18.0, 0.62, 0.42, 0.00, 0.0, 0.50, 0.35],
    [24.0, 0.80, 0.68, 0.50, 0.0, 0.72, 0.55],
    [32.0, 1.00, 1.00, 1.00, 0.0, 1.00, 1.00],
    [47.0, 1.00, 1.00, 1.00, 0.0, 1.00, 1.00],
    [62.0, 0.98, 0.85, 0.55, 1.0, 0.92, 0.00],
    [68.0, 0.98, 0.85, 0.55, 1.0, 0.90, 0.00],
    [82.0, 0.98, 0.85, 0.55, 1.0, 0.90, 0.00],
  ];
  const T_END = KEYS[KEYS.length - 1][0];
  const SHATTER = 65.0, CRACK = 1.8;
  const CLOUD_FORM = 3.0;
  const RAIN_START = 2.5, RAIN_END = 37.0;
  const RAIN_RAMP = 9.0;

  const SOIL_PAL = [[30, 30, 30], [48, 48, 48], [70, 70, 70], [96, 96, 96], [126, 126, 126], [64, 64, 64]];
  const PEBBLE_PAL = [[60, 60, 60], [90, 90, 90], [135, 135, 135], [44, 44, 44]];
  const CLOUD_PAL = [[58, 64, 86], [84, 92, 120], [114, 124, 154], [150, 160, 188]];
  const STAR_PAL =[[255, 255, 255], [215, 228, 255], [255, 244, 220], [190, 205, 255]];
  const STEM_PAL = [[62, 38, 120], [100, 58, 165], [140, 84, 200], [60, 160, 140]];
  const STEM_WILT = [[120, 88, 66], [96, 66, 52], [140, 108, 76]];
  const LEAF_PAL = [[60, 150, 140], [80, 120, 175], [130, 80, 195], [175, 105, 215]];
  const LEAF_WILT = [[130, 100, 70], [104, 76, 58], [146, 116, 84]];
  const RIB_PAL = [[210, 180, 255], [170, 230, 220]];
  const WILT_PAL = [[150, 86, 128], [116, 64, 108], [88, 52, 88], [126, 94, 104], [104, 72, 56]];
  const RIM_PAL = [[205, 165, 255], [255, 190, 250], [170, 140, 255]];
  const HI_PAL = [[235, 215, 255], [255, 225, 250]];
  const GOLD_PAL = [[255, 214, 110], [255, 238, 170], [255, 184, 90]];
  const STAMEN_PAL = [[255, 240, 255], [255, 215, 235], [255, 230, 150], [255, 190, 80]];
  const STAMEN_WILT = [[140, 112, 84], [120, 96, 72]];

  const LAYERS = [
    { n: 8, ac: 0.60, ao: 1.00, kc: -1.20, ko: 0.45, L: 1.00, wc: 0.20, wo: 0.34, d: 1150, off: 0.00,
      pal: [[210, 80, 225], [170, 58, 225], [128, 50, 218], [96, 44, 205], [78, 42, 185]] },
    { n: 6, ac: 0.48, ao: 0.68, kc: -1.05, ko: 0.15, L: 0.88, wc: 0.19, wo: 0.31, d: 950, off: 0.40,
      pal: [[255, 150, 235], [245, 92, 218], [205, 62, 218], [150, 52, 222]] },
    { n: 5, ac: 0.36, ao: 0.46, kc: -0.85, ko: -0.05, L: 0.72, wc: 0.17, wo: 0.27, d: 760, off: 0.20,
      pal: [[255, 205, 245], [255, 135, 232], [238, 84, 216], [195, 62, 226]] },
    { n: 4, ac: 0.22, ao: 0.32, kc: -0.50, ko: -0.10, L: 0.46, wc: 0.14, wo: 0.22, d: 480, off: 0.55,
      pal: [[255, 238, 252], [255, 185, 242], [255, 125, 228]] },
  ];
  const LEAF_DEFS = [
    [0.10, +1, 1.00, 0.55, -0.80],
    [0.16, -1, 0.90, 0.50, -0.85],
    [0.40, +1, 0.70, 0.95, -0.70],
    [0.33, -1, 0.62, 0.90, -0.65],
  ];

  let R = null, spare = null;
  function mulberry32(a) {
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = () => R();
  const uniform = (a, b) => a + (b - a) * R();
  function normal(m, s) {
    if (spare !== null) { const v = spare; spare = null; return m + s * v; }
    let u = 0;
    while (u === 0) u = R();
    const v = R(), r = Math.sqrt(-2 * Math.log(u));
    spare = r * Math.sin(2 * Math.PI * v);
    return m + s * r * Math.cos(2 * Math.PI * v);
  }
  function choice(vals, p) {
    const x = R();
    let c = 0;
    for (let i = 0; i < vals.length; i++) { c += p[i]; if (x < c) return vals[i]; }
    return vals[vals.length - 1];
  }

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const smoothstep = (x, a, b) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const sinc = (x) => (Math.abs(x) < 1e-6 ? 1 : Math.sin(x) / x);
  const profile = (u) => Math.pow(Math.sin(Math.PI * Math.pow(clamp(u, 0, 1), 0.75)), 0.85);
  function areaU() { for (;;) { const u = rand(); if (rand() < profile(u)) return u; } }
  function sampleV(rim) {
    let v = uniform(-1, 1);
    if (rand() < rim) v = Math.sign(v) * uniform(0.88, 1.0);
    return v;
  }

  const ST = new Float64Array(6);
  function state(t) {
    t = clamp(t, 0, T_END);
    let i = 0;
    while (i + 1 < KEYS.length && KEYS[i + 1][0] <= t) i++;
    i = clamp(i, 0, KEYS.length - 2);
    const u = (t - KEYS[i][0]) / (KEYS[i + 1][0] - KEYS[i][0]);
    const p0 = KEYS[Math.max(i - 1, 0)], p1 = KEYS[i], p2 = KEYS[i + 1], p3 = KEYS[Math.min(i + 2, KEYS.length - 1)];
    for (let m = 1; m <= 6; m++) {
      const v = 0.5 * (2 * p1[m] + (p2[m] - p0[m]) * u + (2 * p0[m] - 5 * p1[m] + 4 * p2[m] - p3[m]) * u * u
        + (3 * p1[m] - p0[m] - 3 * p2[m] + p3[m]) * u * u * u);
      ST[m - 1] = clamp(v, 0, 1);
    }
    return ST;
  }

  function pickInto(out, o, pal, g, spread, jitter) {
    if (spread === undefined) spread = 0.55;
    if (jitter === undefined) jitter = 0.07;
    const n = pal.length;
    let idx = Math.round(clamp(g, 0, 1) * (n - 1) + normal(0, spread));
    idx = idx < 0 ? 0 : idx > n - 1 ? n - 1 : idx;
    const j = 1 + normal(0, jitter), c = pal[idx];
    out[o] = c[0] * j; out[o + 1] = c[1] * j; out[o + 2] = c[2] * j;
  }

  function permute(d, n) {
    const p = new Uint32Array(n);
    for (let i = 0; i < n; i++) p[i] = i;
    for (let i = n - 1; i > 0; i--) { const j = (R() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
    const out = { n };
    for (const k in d) {
      const a = d[k], stride = a.length / n, b = new a.constructor(a.length);
      if (stride === 1) for (let i = 0; i < n; i++) b[i] = a[p[i]];
      else for (let i = 0; i < n; i++) { const s = p[i] * 3, o = i * 3; b[o] = a[s]; b[o + 1] = a[s + 1]; b[o + 2] = a[s + 2]; }
      out[k] = b;
    }
    return out;
  }

  const OFF = [];
  for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) if (dx * dx + dy * dy <= 9) OFF.push([dx, dy]);
  OFF.sort((a, b) => (a[0] * a[0] + a[1] * a[1]) - (b[0] * b[0] + b[1] * b[1]) || a[0] - b[0] || a[1] - b[1]);
  const OX = Int8Array.from(OFF, (p) => p[0]), OY = Int8Array.from(OFF, (p) => p[1]);
  const D2 = Int8Array.from(OFF, (p) => p[0] * p[0] + p[1] * p[1]);
  const CNT = new Uint8Array(17);
  for (let q = 0; q <= 16; q++) {
    const r2 = (q / 4) * (q / 4) + 0.01;
    let c = 0;
    while (c < OFF.length && D2[c] <= r2) c++;
    CNT[q] = c;
  }
  let FS = 1;
  const rqOf = (rad) => Math.min(16, Math.round(rad * FS * 4));
  const pack = (r, g, b) => (0xFF000000 | ((b < 0 ? 0 : b > 255 ? 255 : b | 0) << 16) | ((g < 0 ? 0 : g > 255 ? 255 : g | 0) << 8) | (r < 0 ? 0 : r > 255 ? 255 : r | 0));

  function splat(buf, W, H, x, y, pk, rq) {
    const xi = Math.round(x), yi = Math.round(y);
    if (!(xi > -5 && xi < W + 5 && yi > -5 && yi < H + 5)) return;
    const c = CNT[rq];
    for (let k = 0; k < c; k++) {
      const xx = xi + OX[k], yy = yi + OY[k];
      if (xx >= 0 && xx < W && yy >= 0 && yy < H) buf[yy * W + xx] = pk;
    }
  }

  function hash2(a, b) {
    let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1);
    h = Math.imul(h ^ (h >>> 15), 0x85ebca6b); h ^= h >>> 13;
    h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  let BX = 0, BY = 0, BP = 0;

  const Pb = new Float64Array(8), BZ = new Float64Array(4);
  function bez(s) {
    const q = 1 - s, a = q * q * q, b = 3 * q * q * s, c = 3 * q * s * s, d = s * s * s;
    BZ[0] = a * Pb[0] + b * Pb[2] + c * Pb[4] + d * Pb[6];
    BZ[1] = a * Pb[1] + b * Pb[3] + c * Pb[5] + d * Pb[7];
    BZ[2] = 3 * q * q * (Pb[2] - Pb[0]) + 6 * q * s * (Pb[4] - Pb[2]) + 3 * s * s * (Pb[6] - Pb[4]);
    BZ[3] = 3 * q * q * (Pb[3] - Pb[1]) + 6 * q * s * (Pb[5] - Pb[3]) + 3 * s * s * (Pb[7] - Pb[5]);
  }

  class Plant {
    constructor(W, H, f) {
      this.W = W; this.H = H; this.f = f; FS = f;
      R = mulberry32(SEED); spare = null;
      const U = this.U = Math.min(H, W * 1.2);
      this.cx = W / 2;
      this.y0 = H * 0.5 + 0.3 * U;
      this.Ls = U * 0.38;
      this.Lf = U * 0.235;
      this.shc = U * 0.04; this.shk = 0; this.tau = 0; this.tt = 0; this.ex = 0; this.ey = 0;
      this.buildSoil(); this.buildStem(); this.buildHead(); this.buildStamens(); this.buildLeaves(); this.buildFx(); this.buildSky(); this.buildWeather();
      const cap = this.head.n + this.st.n;
      this.sx = new Float32Array(cap); this.sy = new Float32Array(cap); this.sz = new Float32Array(cap);
      this.sp = new Uint32Array(cap); this.sq = new Uint8Array(cap); this.sk = new Uint16Array(cap);
      this.ord = new Uint32Array(cap); this.bins = new Int32Array(1026);
      this.nodeX = new Float32Array(6); this.nodeY = new Float32Array(6);
    }

    surface(x) {
      const U = this.U, f = this.f;
      return this.y0 - 0.022 * U * Math.exp(-(((x - this.cx) / (0.2 * U)) ** 2))
        - 0.003 * U * Math.sin(x / f * 0.045) - 0.002 * U * Math.sin(x / f * 0.13 + 1.3);
    }

    buildSoil() {
      const { W, H, U, f } = this;
      const area = (W * U) / 1000000;
      const n = clamp(Math.round(26000 * area), 8000, 80000);
      this.base = new Uint32Array(W * H).fill(0xFF000000);
      const col = new Float32Array(3);
      for (let i = 0; i < n; i++) {
        const x = uniform(0, W), d = Math.pow(rand(), 1.5) * 0.14 * U, y = this.surface(x) + d;
        const depth = d / (0.14 * U);
        const edge = Math.pow(clamp(Math.min(x, W - x) / (0.2 * W), 0, 1), 0.8);
        const xf = x / f, yf = y / f;
        const clump = 0.5 + 0.5 * Math.sin(xf * 0.07 + yf * 0.05) * Math.sin(yf * 0.11 - xf * 0.03);
        const bright = Math.pow(1 - depth, 0.8) * edge * (0.55 + 0.35 * clump + 0.35 * rand());
        pickInto(col, 0, SOIL_PAL, rand(), 1.0);
        splat(this.base, W, H, x, y, pack(col[0] * bright, col[1] * bright, col[2] * bright), rqOf(choice([1, 1.5, 2], [0.4, 0.4, 0.2])));
      }
      const k = Math.max(80, Math.round(170 * area));
      for (let i = 0; i < k; i++) {
        const px = uniform(0.05 * W, 0.95 * W), py = this.surface(px) + Math.pow(rand(), 1.3) * 0.1 * U;
        pickInto(col, 0, PEBBLE_PAL, rand(), 0.7);
        const e = Math.pow(clamp(Math.min(px, W - px) / (0.2 * W), 0, 1), 0.8);
        splat(this.base, W, H, px, py, pack(col[0] * e, col[1] * e, col[2] * e), rqOf(choice([2, 3], [0.6, 0.4])));
      }
      const m = 520, cr = { n: m, x: new Float32Array(m), y: new Float32Array(m), amp: new Float32Array(m),
        delay: new Float32Array(m), col: new Float32Array(m * 3), rq: new Uint8Array(m) };
      for (let i = 0; i < m; i++) {
        const x = this.cx + normal(0, 0.03 * U);
        cr.x[i] = x; cr.y[i] = this.surface(x) - rand() * 0.006 * U;
        cr.amp[i] = U * 0.05 * Math.pow(rand(), 2.2); cr.delay[i] = uniform(8, 10.5);
        pickInto(col, 0, SOIL_PAL, uniform(0.3, 1), 0.8);
        cr.col[i * 3] = col[0] * 0.8; cr.col[i * 3 + 1] = col[1] * 0.8; cr.col[i * 3 + 2] = col[2] * 0.8;
        cr.rq[i] = rqOf(choice([1, 1.5, 2], [0.4, 0.4, 0.2]));
      }
      this.cr = cr;
    }

    buildStem() {
      const n = 3600, d = { s: new Float32Array(n), lat: new Float32Array(n), live: new Float32Array(n * 3),
        wilt: new Float32Array(n * 3), rn: new Float32Array(n), rq: new Uint8Array(n) };
      const stemLive = STEM_PAL.slice(0, 3);
      for (let i = 0; i < n; i++) {
        const s = rand(); let lat = uniform(-1, 1);
        if (rand() < 0.18) lat = Math.sign(lat) * uniform(0.85, 1.0);
        d.s[i] = s; d.lat[i] = lat;
        pickInto(d.live, i * 3, stemLive, s * 0.8 + rand() * 0.2);
        if (rand() < 0.12) {
          const j = 1 + normal(0, 0.08), c = STEM_PAL[3];
          d.live[i * 3] = c[0] * j; d.live[i * 3 + 1] = c[1] * j; d.live[i * 3 + 2] = c[2] * j;
        }
        pickInto(d.wilt, i * 3, STEM_WILT, rand(), 0.8);
        d.rn[i] = rand(); d.rq[i] = rqOf(choice([1, 1.5, 2], [0.35, 0.45, 0.2]));
      }
      this.stem = permute(d, n);
    }

    buildHead() {
      let n = 0;
      for (const Ly of LAYERS) n += Ly.n * Ly.d;
      const F = () => new Float32Array(n);
      const d = { cth: F(), sth: F(), aj: F(), pj: F(), wj: F(), u: F(), v: F(), ac: F(), ao: F(), kc: F(), ko: F(),
        L: F(), wc: F(), wo: F(), sp: F(), rn: F(), rq: new Uint8Array(n),
        live: new Float32Array(n * 3), wilt: new Float32Array(n * 3) };
      let k = 0;
      for (const Ly of LAYERS) {
        for (let i = 0; i < Ly.n; i++) {
          const th = 2 * Math.PI * i / Ly.n + Ly.off + normal(0, 0.10);
          const aj = normal(0, 0.06), lj = uniform(0.92, 1.08), pj = rand(), wj = uniform(-0.5, 0.5);
          const c = Math.cos(th), s = Math.sin(th);
          for (let j = 0; j < Ly.d; j++, k++) {
            const u = areaU(), v = sampleV(0.14), o = k * 3;
            pickInto(d.live, o, Ly.pal, u + normal(0, 0.10));
            if (Math.abs(v) > 0.86 && rand() < 0.55) pickInto(d.live, o, RIM_PAL, rand());
            if (rand() < 0.04) pickInto(d.live, o, HI_PAL, rand());
            if (rand() < 0.02 && u < 0.55) pickInto(d.live, o, GOLD_PAL, rand());
            d.cth[k] = c; d.sth[k] = s; d.aj[k] = aj; d.pj[k] = pj; d.wj[k] = wj; d.u[k] = u; d.v[k] = v;
            d.ac[k] = Ly.ac; d.ao[k] = Ly.ao; d.kc[k] = Ly.kc; d.ko[k] = Ly.ko;
            d.L[k] = Ly.L * lj; d.wc[k] = Ly.wc; d.wo[k] = Ly.wo; d.sp[k] = profile(u);
            pickInto(d.wilt, o, WILT_PAL, 0.4 * u + 0.6 * rand(), 0.7);
            d.rn[k] = rand(); d.rq[k] = rqOf(choice([1, 1.5, 2], [0.3, 0.45, 0.25]));
          }
        }
      }
      this.head = permute(d, n);
    }

    buildStamens() {
      const n = 700, nf = 60;
      const thF = [], betaF = [], ellF = [];
      for (let i = 0; i < nf; i++) thF.push(uniform(0, 2 * Math.PI));
      for (let i = 0; i < nf; i++) betaF.push(uniform(0.2, 0.85));
      for (let i = 0; i < nf; i++) ellF.push(uniform(0.30, 0.55));
      const d = { th: new Float32Array(n), beta: new Float32Array(n), ell: new Float32Array(n), t: new Float32Array(n),
        live: new Float32Array(n * 3), wilt: new Float32Array(n * 3), rq: new Uint8Array(n) };
      for (let i = 0; i < n; i++) {
        const fid = (rand() * nf) | 0, t = 1 - Math.pow(rand(), 1.6);
        d.th[i] = thF[fid]; d.beta[i] = betaF[fid]; d.ell[i] = ellF[fid]; d.t[i] = t;
        pickInto(d.live, i * 3, STAMEN_PAL, t, 0.35);
        pickInto(d.wilt, i * 3, STAMEN_WILT, rand(), 0.6);
        d.rq[i] = rqOf(t > 0.88 ? 2.0 : choice([1, 1.5], [0.5, 0.5]));
      }
      this.st = permute(d, n);
    }

    buildLeaves() {
      const per = 900, n = per * LEAF_DEFS.length;
      const d = { lid: new Uint8Array(n), u: new Float32Array(n), v: new Float32Array(n), live: new Float32Array(n * 3),
        wilt: new Float32Array(n * 3), rn: new Float32Array(n), rq: new Uint8Array(n) };
      let k = 0;
      for (let j = 0; j < LEAF_DEFS.length; j++) {
        for (let i = 0; i < per; i++, k++) {
          const u = areaU(); let v = sampleV(0.10);
          const rib = rand() < 0.09;
          if (rib) v = normal(0, 0.03);
          d.lid[k] = j; d.u[k] = u; d.v[k] = v;
          if (rib) pickInto(d.live, k * 3, RIB_PAL, rand());
          else pickInto(d.live, k * 3, LEAF_PAL, u + normal(0, 0.1));
          pickInto(d.wilt, k * 3, LEAF_WILT, rand(), 0.8);
          d.rn[k] = rand(); d.rq[k] = rqOf(choice([1, 1.5, 2], [0.35, 0.45, 0.2]));
        }
      }
      this.leaf = permute(d, n);
    }

    buildFx() {
      const U = this.U;
      let n = 1800;

    buildSky() {

    buildWeather() {

      d = { x0: new Float32Array(n), x1: new Float32Array(n), ys: new Float32Array(n), yg: new Float32Array(n),
        ph: new Float32Array(n), sp: new Float32Array(n), b: new Float32Array(n) };

    dot(buf, x, y, pk, rq, salt) {

    render(t, buf) {

          for (let i = 0; i < Hh.n; i++) {
            const rh = Hh.r[i] * Ls_ * grow, br = e * Hh.b[i] * 1.6;
            splat(buf, W, H, ccx + Math.cos(Hh.a[i]) * rh, ccy + Math.sin(Hh.a[i]) * rh + 0.12 * U * bt * bt * Hh.fl[i],
              pack(225 * br, 175 * br, 255 * br), rq1);
          }
        }

        if (wilt > 0.02) {
          const F = this.fall;
          for (let i = 0; i < F.n; i++) {
            const fp = clamp((wilt * 1.05 - F.r0[i] * 0.7) / 0.35, 0, 1);
            if (fp <= 0) continue;
            const sx0 = hx + F.ox[i] * 0.18 * Ls_, sy0 = hy + F.oy[i] * 0.18 * Ls_ + 0.25 * Ls_;
            const x = sx0 + (F.xl[i] - sx0) * fp + Math.sin(fp * 6.28 + F.ph[i]) * 0.03 * U * (1 - fp);
            const y = sy0 + (F.yl[i] - sy0) * fp * fp;
            splat(buf, W, H, x, y, pack(F.col[i * 3], F.col[i * 3 + 1], F.col[i * 3 + 2]), F.rq[i]);
          }
        }

        if (glowOn) {
          const Sp = this.spark;
          for (let i = 0; i < Sp.n; i++) {
            const life = (t * 0.10 * Sp.sp[i] + Sp.ph[i]) % 1.0;
            const rho = (0.25 + 1.15 * Sp.rho[i]) * Ls_ * (0.6 + 0.6 * life);
            const bs = Math.pow(Math.sin(Math.PI * life), 0.8) * glow;
            const px = ccx + Math.cos(Sp.a[i]) * rho, py = ccy + Math.sin(Sp.a[i]) * rho - life * 0.25 * Ls_;
            splat(buf, W, H, px, py, Sp.hue[i] < 0.5 ? pack(255 * bs, 215 * bs, 255 * bs) : pack(255 * bs, 150 * bs, 235 * bs), Sp.rq[i]);
          }
          const Rs = Ls_ * 1.25, rq3 = rqOf(3), nodePk = pack(255 * glow, 215 * glow, 255 * glow);
          for (let k = 0; k < 6; k++) {
            const ja = 2 * Math.PI * k / 6 + t * 0.15;
            splat(buf, W, H, ccx + Rs * Math.cos(ja), ccy + Rs * Math.sin(ja), nodePk, rq3);
          }
        }
      }

      const C = this.cr;
      for (let i = 0; i < C.n; i++) {
        const e = clamp((t - C.delay[i]) / 3.0, 0, 1);
        splat(buf, W, H, C.x[i], C.y[i] - C.amp[i] * Math.sin(Math.PI * e), pack(C.col[i * 3], C.col[i * 3 + 1], C.col[i * 3 + 2]), C.rq[i]);
      }
    }
  }

  const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
  const hint = document.getElementById('hint');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let plant = null, img = null, buf = null, qNow = 1, qCap = 2, shrinks = 0;
  let clock = reduceMotion ? 25 * TIME_SCALE : START_AT * TIME_SCALE;
  let last = performance.now(), paused = reduceMotion || params.get('pause') === '1', dirty = true, slow = 0;

  function setup() {
    const cssW = Math.max(1, cv.clientWidth), cssH = Math.max(1, cv.clientHeight);
    let q = Q_FORCE || Math.min(window.devicePixelRatio || 1, 2, qCap);
    if (!Q_FORCE) q = Math.max(0.5, Math.min(q, Math.sqrt(1.5e6 / (cssW * cssH))));
    qNow = q;
    const W = Math.max(64, Math.round(cssW * q)), H = Math.max(64, Math.round(cssH * q));
    const f = clamp(Math.min(H, W * 1.2) / 1000, 0.75, 1.5);
    cv.width = W; cv.height = H;
    img = ctx.createImageData(W, H);
    buf = new Uint32Array(img.data.buffer);
    plant = new Plant(W, H, f);
    dirty = true;
  }

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (!paused) clock += dt; else if (!dirty) return;
    let t = clock / TIME_SCALE;
    if (LOOP && t > T_END + 4) { clock = 0; t = 0; }
    const t0 = performance.now();
    plant.render(t, buf);
    ctx.putImageData(img, 0, 0);
    dirty = false;
    if (!Q_FORCE && shrinks < 3 && !paused) {
      slow = performance.now() - t0 > 24 ? slow + 1 : Math.max(0, slow - 1);
      if (slow > 40) { slow = 0; shrinks++; qCap = qNow * 0.8; setup(); }
    }
    hint.classList.toggle('show', t > T_END - 6 || paused && !reduceMotion);
  }

  function restart() { clock = 0; dirty = true; paused = false; }

  cv.addEventListener('click', restart);
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); paused = !paused; last = performance.now(); dirty = true; }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(setup, 150); });

  setup();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
